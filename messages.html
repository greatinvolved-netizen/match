<!DOCTYPE html>
<html>
<head>
  <title>Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">Chat4Fun</div>
  <nav class="nav">
    <a href="directory.html">Browse</a>
    <a href="profile.html">My Profile</a>
    <button id="logoutBtn">Log Out</button>
  </nav>
</header>

<div class="message-page">
  <aside class="conversations">
    <div style="padding:14px">
      <h3>Conversations</h3>
      <p class="muted">Start a message from a profile card.</p>
    </div>
    <div id="conversationList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <h2 id="chatTitle">Select a conversation</h2>
      <p id="chatSubtitle" class="muted"></p>
    </div>

    <div id="messagesBox"></div>

    <div id="imagePreviewContainer"></div>

    <div class="chat-input">
      <label for="imageInput" id="imageButton">📷</label>

      <input id="imageInput" type="file" accept="image/*" disabled hidden>

      <input id="messageInput" placeholder="Type a message..." disabled>

      <button id="sendBtn" disabled>Send</button>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  getDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const conversationList = document.getElementById("conversationList");
const messagesBox = document.getElementById("messagesBox");
const messageInput = document.getElementById("messageInput");
const imageInput = document.getElementById("imageInput");
const previewContainer = document.getElementById("imagePreviewContainer");
const sendBtn = document.getElementById("sendBtn");
const chatTitle = document.getElementById("chatTitle");
const chatSubtitle = document.getElementById("chatSubtitle");
const imageButton = document.getElementById("imageButton");

let currentUser = null;
let currentProfile = null;
let selectedUid = new URLSearchParams(window.location.search).get("uid");
let selectedProfile = null;
let unsubscribeMessages = null;

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];

  if (!file) {
    previewContainer.style.display = "none";
    previewContainer.innerHTML = "";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Only image files are allowed.");
    imageInput.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Image must be under 5 MB.");
    imageInput.value = "";
    return;
  }

  const url = URL.createObjectURL(file);

  previewContainer.innerHTML = `
    <img id="imagePreview" src="${url}" alt="Image preview">
    <button id="removePreview">Remove</button>
  `;

  previewContainer.style.display = "block";

  document.getElementById("removePreview").onclick = () => {
    imageInput.value = "";
    previewContainer.innerHTML = "";
    previewContainer.style.display = "none";
  };
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  const ownSnap = await getDoc(doc(db, "users", user.uid));
  currentProfile = ownSnap.exists()
    ? ownSnap.data()
    : { username: user.email, avatar: "" };

  await loadConversations();

  if (selectedUid && selectedUid !== currentUser.uid) {
    await openConversation(selectedUid);
  }
});

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

function getConversationId(a, b) {
  return [a, b].sort().join("_");
}

async function loadConversations() {
  conversationList.innerHTML = "";

  if (!currentUser) return;

  const ids = new Set();

  if (selectedUid && selectedUid !== currentUser.uid) {
    ids.add(selectedUid);
  }

  try {
    const sentQ = query(collection(db, "messages"), where("senderId", "==", currentUser.uid));
    const receivedQ = query(collection(db, "messages"), where("receiverId", "==", currentUser.uid));

    const sentSnap = await getDocs(sentQ);
    sentSnap.forEach((d) => {
      const data = d.data();
      if (data.receiverId) ids.add(data.receiverId);
    });

    const receivedSnap = await getDocs(receivedQ);
    receivedSnap.forEach((d) => {
      const data = d.data();
      if (data.senderId) ids.add(data.senderId);
    });

    if (ids.size === 0) {
      conversationList.innerHTML = `<div class="conversation">No conversations yet</div>`;
      return;
    }

    for (const uid of ids) {
      if (!uid || uid === currentUser.uid) continue;

      const userSnap = await getDoc(doc(db, "users", uid));
      const otherUser = userSnap.exists()
        ? userSnap.data()
        : { uid, username: "User", avatar: "" };

      const div = document.createElement("div");
      div.className = "conversation";

const avatar = document.createElement("img");

if (
  msg.senderAvatar &&
  msg.senderAvatar.startsWith("http")
) {
  avatar.src = msg.senderAvatar;
} else {
  avatar.src =
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(msg.senderName || "User") +
    "&background=667eea&color=ffffff";
}

avatar.alt = "avatar";
avatar.style.width = "40px";
avatar.style.height = "40px";
avatar.style.borderRadius = "50%";
avatar.style.objectFit = "cover";
      avatar.style.marginRight = "8px";
      avatar.style.verticalAlign = "middle";

      const name = document.createElement("span");
      name.textContent = otherUser.username || "User";

      div.appendChild(avatar);
      div.appendChild(name);

      div.onclick = () => {
        openConversation(uid);
      };

      conversationList.appendChild(div);
    }
  } catch (error) {
    alert("Conversation loading error: " + error.message);
  }
}

async function openConversation(uid) {
  selectedUid = uid;

  const snap = await getDoc(doc(db, "users", uid));
  selectedProfile = snap.exists()
    ? snap.data()
    : { uid, username: "User", avatar: "" };

  chatTitle.textContent = selectedProfile.username || "User";
  chatSubtitle.textContent = selectedProfile.status || "";

  messageInput.disabled = false;
  imageInput.disabled = false;
  sendBtn.disabled = false;
  imageButton.style.opacity = "1";
  imageButton.style.pointerEvents = "auto";

  if (unsubscribeMessages) unsubscribeMessages();

  const conversationId = getConversationId(currentUser.uid, selectedUid);

  const messagesQuery = query(
    collection(db, "messages"),
    where("conversationId", "==", conversationId),
    orderBy("createdAt")
  );

  unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
    messagesBox.innerHTML = "";

    snapshot.forEach((docSnap) => {
      const msg = docSnap.data();

      let time = "";
      if (msg.createdAt) {
        time = new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      const wrapper = document.createElement("div");
      wrapper.style.display = "flex";
      wrapper.style.alignItems = "flex-start";
      wrapper.style.gap = "10px";
      wrapper.style.marginBottom = "12px";

      if (msg.senderId === currentUser.uid) {
        wrapper.style.justifyContent = "flex-end";
        wrapper.style.flexDirection = "row-reverse";
      }

      const avatar = document.createElement("img");
    avatar.src = msg.senderAvatar || "https://via.placeholder.com/40";
      avatar.alt = "avatar";
      avatar.style.width = "40px";
      avatar.style.height = "40px";
      avatar.style.borderRadius = "50%";
      avatar.style.objectFit = "cover";

      const bubble = document.createElement("div");
      bubble.className = "msg";

      if (msg.senderId === currentUser.uid) {
        bubble.classList.add("mine");
      }

      if (msg.text) {
        const text = document.createElement("div");
        text.textContent = msg.text;
        bubble.appendChild(text);
      }

      if (msg.imageURL) {
        const img = document.createElement("img");
        img.src = msg.imageURL;
        img.alt = "Sent image";
        img.style.maxWidth = "240px";
        img.style.maxHeight = "240px";
        img.style.borderRadius = "12px";
        img.style.display = "block";
        img.style.marginTop = "8px";
        bubble.appendChild(img);
      }

      const small = document.createElement("small");
      small.textContent = `${msg.senderName || "User"} • ${time}`;
      bubble.appendChild(small);

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messagesBox.appendChild(wrapper);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  }, (error) => {
    alert("Message loading error: " + error.message);
  });
}

async function uploadChatImage(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const filePath = `chatImages/${currentUser.uid}/${Date.now()}_${safeName}`;
  const fileRef = ref(storage, filePath);

  await uploadBytes(fileRef, file);
  return await getDownloadURL(fileRef);
}

async function sendMessage() {
  const text = messageInput.value.trim();
  const file = imageInput.files[0];

  if (!text && !file) return;

  if (!currentUser || !selectedUid) {
    alert("No conversation selected.");
    return;
  }

  try {
    let imageURL = "";

    if (file) {
      if (!file.type.startsWith("image/")) {
        alert("Only image files are allowed.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        alert("Image must be under 5 MB.");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Uploading...";

      imageURL = await uploadChatImage(file);
    }

    const conversationId = getConversationId(currentUser.uid, selectedUid);

    await addDoc(collection(db, "messages"), {
      conversationId,
      senderId: currentUser.uid,
      receiverId: selectedUid,
      senderName: currentProfile?.username || currentUser.email,
      senderAvatar: currentProfile?.avatar || "",
      receiverName: selectedProfile?.username || "User",
      text,
      imageURL,
      createdAt: serverTimestamp()
    });

    messageInput.value = "";
    imageInput.value = "";
    previewContainer.innerHTML = "";
    previewContainer.style.display = "none";

    await loadConversations();

  } catch (error) {
    alert("Message failed: " + error.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
  }
}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
