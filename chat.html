<!DOCTYPE html>
<html>
<head>
  <title>Chat4Fun</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center}
    .app{width:95%;max-width:900px;height:92vh;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
    header{background:#202124;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
    header h1{margin:0}
    header button{margin-left:8px;background:#667eea;color:white;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:bold}
    #logoutBtn{background:#444}
    #chatBox{flex:1;padding:20px;overflow-y:auto;background:#f5f7fb}
    .msg{background:white;padding:12px 15px;margin-bottom:12px;border-radius:14px;max-width:75%;box-shadow:0 3px 8px rgba(0,0,0,.08)}
    .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#ddd}
    .username{font-weight:bold}
    .text{font-size:15px;word-wrap:break-word}
    .time{font-size:11px;color:gray;margin-top:6px}
    #inputArea{display:flex;gap:8px;padding:15px;background:white;border-top:1px solid #ddd}
    input{border:1px solid #ccc;border-radius:12px;padding:12px;font-size:15px;outline:none}
    #messageInput{flex:1}
    #sendBtn{border:none;background:#667eea;color:white;padding:10px 18px;border-radius:12px;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Chat4Fun</h1>
      <small id="userStatus">Checking login...</small>
    </div>
    <div>
      <button onclick="window.location.href='profile.html'">Profile</button>
      <button id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div id="chatBox"></div>

  <div id="inputArea">
    <input id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy,
  onSnapshot, serverTimestamp, doc, getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const userStatus = document.getElementById("userStatus");

let currentUser = null;
let currentProfile = null;

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  const snap = await getDoc(doc(db, "users", user.uid));
  currentProfile = snap.exists() ? snap.data() : null;

  userStatus.textContent = "Logged in as " + (currentProfile?.username || user.email);
});

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

async function sendMessage() {
  if (!currentUser) return;

  const text = messageInput.value.trim();
  if (!text) return;

  await addDoc(collection(db, "messages"), {
    uid: currentUser.uid,
    name: currentProfile?.username || currentUser.displayName || currentUser.email,
    avatar: currentProfile?.avatar || "",
    color: currentProfile?.color || "#667eea",
    text,
    createdAt: serverTimestamp()
  });

  messageInput.value = "";
}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

const q = query(collection(db, "messages"), orderBy("createdAt"));

onSnapshot(q, snapshot => {
  chatBox.innerHTML = "";

  snapshot.forEach(docSnap => {
    const msg = docSnap.data();

    const messageDiv = document.createElement("div");
    messageDiv.className = "msg";

    const topDiv = document.createElement("div");
    topDiv.className = "top";

    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.src = msg.avatar || "https://via.placeholder.com/30";

    const username = document.createElement("div");
    username.className = "username";
    username.style.color = msg.color || "#667eea";
    username.textContent = msg.name || "Anonymous";

    const textDiv = document.createElement("div");
    textDiv.className = "text";
    textDiv.textContent = msg.text;

    const timeDiv = document.createElement("div");
    timeDiv.className = "time";

    if (msg.createdAt) {
      timeDiv.textContent = new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    topDiv.appendChild(avatar);
    topDiv.appendChild(username);

    messageDiv.appendChild(topDiv);
    messageDiv.appendChild(textDiv);
    messageDiv.appendChild(timeDiv);

    chatBox.appendChild(messageDiv);
  });

  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
