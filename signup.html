<!DOCTYPE html>
<html>
<head>
  <title>Create Account</title>
  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center}
    .card{background:white;padding:35px;border-radius:20px;width:90%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,.25);text-align:center}
    input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;font-size:16px}
    input{border:1px solid #ccc}
    button{border:none;background:#667eea;color:white;font-weight:bold;cursor:pointer}
    a{color:#667eea;font-weight:bold}
  </style>
</head>
<body>

<div class="card">
  <h1>Create Account</h1>
  <p>Join Chat4Fun</p>
  <input id="emailInput" type="email" placeholder="Email">
  <input id="passwordInput" type="password" placeholder="Password">
  <input id="usernameInput" placeholder="Username">
  <button id="signupBtn">Sign Up</button>
  <p>Already have an account? <a href="index.html">Log in</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("signupBtn").onclick = async () => {
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const username = document.getElementById("usernameInput").value.trim();

  if (!username) {
    alert("Enter a username.");
    return;
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(userCredential.user, {
      displayName: username
    });

    await setDoc(doc(db, "users", userCredential.user.uid), {
      uid: userCredential.user.uid,
      email,
      username,
      bio: "",
      avatar: "",
      color: "#667eea"
    });

    window.location.href = "chat.html";
  } catch (error) {
    alert(error.message);
  }
};
</script>

</body>
</html>
