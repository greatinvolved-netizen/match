<!DOCTYPE html>
<html>
<head>
  <title>Server</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">Chat4Fun</div>
  <nav class="nav">
    <a href="servers.html">Servers</a>
    <a href="directory.html">Browse</a>
    <a href="messages.html">Messages</a>
    <button id="logoutBtn">Log Out</button>
  </nav>
</header>

<div class="message-page">
  <aside class="conversations">
    <div style="padding:14px">
      <h3 id="serverName">Loading server...</h3>
      <p class="muted">Channels</p>
      <input id="channelNameInput" placeholder="new-channel">
      <button id="addChannelBtn">Add Channel</button>
    </div>
    <div id="channelsList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <h2 id="channelTitle">Select a channel</h2>
      <p class="muted">Server chat</p>
    </div>

    <div id="messagesBox"></div>

    <div class="chat-input">
      <input id="messageInput" placeholder="Type a message..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const serverId = new URLSearchParams(window.location.search).get("serverId");

const serverName = document.getElementById("serverName");
const channelsList = document.getElementById("channelsList");
const channelTitle = document.getElementById("channelTitle");
const messagesBox = document.getElementById("messagesBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const channelNameInput = document.getElementById("channelNameInput");
const addChannelBtn = document.getElementById("addChannelBtn");

let currentUser = null;
let currentProfile = null;
let selectedChannelId = null;
let selectedChannelName = "";
let unsubscribeMessages = null;
let unsubscribeChannels = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  if (!serverId) {
    alert("No server selected.");
    window.location.href = "servers.html";
    return;
  }

  const ownSnap = await getDoc(doc(db, "users", user.uid));
  currentProfile = ownSnap.exists()
    ? ownSnap.data()
    : { username: user.email };

  await loadServer();
  await joinServerIfNeeded();
  loadChannels();
});

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};

async function loadServer() {
  try {
    const serverSnap = await getDoc(doc(db, "servers", serverId));

    if (!serverSnap.exists()) {
      serverName.textContent = "Server not found";
      alert("This server could not be found. The serverId may be wrong.");
      return;
    }

    serverName.textContent = serverSnap.data().name || "Unnamed Server";
  } catch (error) {
    alert("Server loading error: " + error.message);
  }
}

async function joinServerIfNeeded() {
  await setDoc(doc(db, "serverMembers", serverId + "_" + currentUser.uid), {
    serverId: serverId,
    uid: currentUser.uid,
    joinedAt: serverTimestamp()
  }, { merge: true });
}

addChannelBtn.onclick = async () => {
  let name = channelNameInput.value.trim();

  if (!name) {
    name = prompt("Channel name:");
    if (!name) return;
  }

  name = name
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^a-zA-Z0-9-_]/g, "")
    .toLowerCase();

  if (!name) {
    alert("Channel name must contain letters or numbers.");
    return;
  }

  try {
    addChannelBtn.disabled = true;
    addChannelBtn.textContent = "Adding...";

    await addDoc(collection(db, "channels"), {
      serverId: serverId,
      name: name,
      createdBy: currentUser.uid,
      createdAt: serverTimestamp()
    });

    channelNameInput.value = "";
  } catch (error) {
    alert("Channel creation failed: " + error.message);
  } finally {
    addChannelBtn.disabled = false;
    addChannelBtn.textContent = "Add Channel";
  }
};

function loadChannels() {
  if (unsubscribeChannels) unsubscribeChannels();

  const channelsQuery = query(
    collection(db, "channels"),
    where("serverId", "==", serverId),
    orderBy("createdAt")
  );

  unsubscribeChannels = onSnapshot(channelsQuery, async (snapshot) => {
    channelsList.innerHTML = "";


    snapshot.forEach((docSnap) => {
      const channel = docSnap.data();

      const div = document.createElement("div");
      div.className = "conversation";
      div.textContent = "# " + (channel.name || "channel");

      div.onclick = () => {
        openChannel(docSnap.id, channel.name || "channel");
      };

      channelsList.appendChild(div);
    });

    if (!selectedChannelId) {
      const first = snapshot.docs[0];
      openChannel(first.id, first.data().name || "channel");
    }
  }, (error) => {
    alert("Channel loading error: " + error.message);
  });
}

function openChannel(channelId, channelName) {
  selectedChannelId = channelId;
  selectedChannelName = channelName;

  channelTitle.textContent = "# " + channelName;

  messageInput.disabled = false;
  sendBtn.disabled = false;

  if (unsubscribeMessages) unsubscribeMessages();

  const messagesQuery = query(
    collection(db, "channelMessages"),
    where("serverId", "==", serverId),
    where("channelId", "==", channelId),
    orderBy("createdAt")
  );

  unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
    messagesBox.innerHTML = "";

    snapshot.forEach((docSnap) => {
      const msg = docSnap.data();

      const div = document.createElement("div");
      div.className = "msg";

      if (msg.senderId === currentUser.uid) {
        div.classList.add("mine");
      }

      const text = document.createElement("div");
      text.textContent = msg.text || "";
      div.appendChild(text);

      const small = document.createElement("small");

      let time = "";
      if (msg.createdAt) {
        time = new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      small.textContent = `${msg.senderName || "User"} • ${time}`;
      div.appendChild(small);

      messagesBox.appendChild(div);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  }, (error) => {
    alert("Server message loading error: " + error.message);
  });
}

async function sendChannelMessage() {
  const text = messageInput.value.trim();

  if (!text || !selectedChannelId) return;

  try {
    await addDoc(collection(db, "channelMessages"), {
      serverId: serverId,
      channelId: selectedChannelId,
      channelName: selectedChannelName,
      senderId: currentUser.uid,
      senderName: currentProfile?.username || currentUser.email,
      text: text,
      createdAt: serverTimestamp()
    });

    messageInput.value = "";
  } catch (error) {
    alert("Message send failed: " + error.message);
  }
}

sendBtn.onclick = sendChannelMessage;

messageInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    sendChannelMessage();
  }
});
</script>

</body>
</html>
