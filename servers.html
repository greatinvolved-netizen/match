<!DOCTYPE html>
<html>
<head><title>Servers</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar">
  <div class="logo">Chat4Fun</div>
  <nav class="nav">
    <a href="directory.html">Browse</a>
    <a href="messages.html">Messages</a>
    <a href="profile.html">My Profile</a>
    <button id="logoutBtn">Log Out</button>
  </nav>
</header>
<main class="container">
  <section class="hero-panel">
    <h1>Servers</h1>
    <p class="muted">Create or join community servers with channels.</p>
    <button onclick="window.location.href='create-server.html'">Create Server</button>
  </section>
  <h2>Available Servers</h2>
  <div id="serversGrid" class="grid"></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const grid = document.getElementById("serversGrid");
let currentUser = null;
onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = "index.html"; return; }
  currentUser = user;
});
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "index.html";
};
const q = query(collection(db, "servers"), orderBy("createdAt", "desc"));
onSnapshot(q, snapshot => {
  grid.innerHTML = "";
  snapshot.forEach(docSnap => {
    const server = docSnap.data();
    const serverId = docSnap.id;
    const card = document.createElement("div");
    card.className = "profile-card";
    card.innerHTML = `
      <h3>${escapeHTML(server.name || "Server")}</h3>
      <p class="muted">${escapeHTML(server.description || "No description.")}</p>
      <div class="profile-actions"><button>Join / Open</button></div>`;
    card.querySelector("button").onclick = async () => {
      await setDoc(doc(db, "serverMembers", serverId + "_" + currentUser.uid), {
        serverId, uid: currentUser.uid, joinedAt: serverTimestamp()
      });
      window.location.href = "server.html?serverId=" + serverId;
    };
    grid.appendChild(card);
  });
});
function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script></body></html>
