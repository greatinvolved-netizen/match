<!DOCTYPE html>
<html>
<head>
  <title>Chat4Fun Login</title>
  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center}
    .card{background:white;padding:35px;border-radius:20px;width:90%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,.25);text-align:center}
    input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;font-size:16px}
    input{border:1px solid #ccc}
    button{border:none;background:#667eea;color:white;font-weight:bold;cursor:pointer}
    a{color:#667eea;font-weight:bold}
  </style>
</head>
<body>

<div class="card">
  <h1>Chat4Fun</h1>
  <p>Log in to enter the chat</p>
  <input id="emailInput" type="email" placeholder="Email">
  <input id="passwordInput" type="password" placeholder="Password">
  <button id="loginBtn">Log In</button>
  <p>Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (user) window.location.href = "chat.html";
});

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "chat.html";
  } catch (error) {
    alert(error.message);
  }
};
</script>

</body>
</html>
