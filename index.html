<!DOCTYPE html>
<html>
<head>
  <title>Chat4Fun</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 850px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
    }

    header {
      background: #202124;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0 0;
      color: #bbb;
      font-size: 14px;
    }

    #chatBox {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f5f7fb;
    }

    .msg {
      background: white;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      max-width: 75%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }

    .username {
      font-weight: bold;
      color: #5b5fc7;
      margin-bottom: 4px;
    }

    .text {
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .time {
      font-size: 11px;
      color: gray;
      margin-top: 6px;
    }

    #inputArea {
      display: flex;
      gap: 8px;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    input {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    #nameInput {
      width: 25%;
    }

    #messageInput {
      flex: 1;
    }

    button {
      border: none;
      background: #667eea;
      color: white;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #5568d8;
    }

    @media (max-width: 600px) {
      #inputArea {
        flex-direction: column;
      }

      #nameInput {
        width: 100%;
      }

      .msg {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>

<div class="app">
  <header>
    <h1>Chat4Fun</h1>
    <p>Live public chat room</p>
  </header>

  <div id="chatBox"></div>

  <div id="inputArea">
    <input id="nameInput" placeholder="Username">
    <input id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "chat4fun-e22c0.firebaseapp.com",
    projectId: "chat4fun-e22c0",
    storageBucket: "chat4fun-e22c0.firebasestorage.app",
    messagingSenderId: "937250432936",
    appId: "1:937250432936:web:db4d94d82171cc98519f9d",
    measurementId: "G-NJMKG24NRM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const chatBox = document.getElementById("chatBox");
  const nameInput = document.getElementById("nameInput");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  nameInput.value = localStorage.getItem("chatUsername") || "";

  nameInput.addEventListener("input", () => {
    localStorage.setItem("chatUsername", nameInput.value);
  });

  async function sendMessage() {
    const name = nameInput.value.trim() || "Anonymous";
    const text = messageInput.value.trim();

    if (text === "") return;

    await addDoc(collection(db, "messages"), {
      name,
      text,
      createdAt: serverTimestamp()
    });

    messageInput.value = "";
  }

  sendBtn.onclick = sendMessage;

  messageInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  const q = query(collection(db, "messages"), orderBy("createdAt"));

  onSnapshot(q, (snapshot) => {
    chatBox.innerHTML = "";

    snapshot.forEach((doc) => {
      const msg = doc.data();

      let time = "";
      if (msg.createdAt) {
        time = new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      const messageDiv = document.createElement("div");
      messageDiv.className = "msg";

      messageDiv.innerHTML = `
        <div class="username">${msg.name}</div>
        <div class="text">${msg.text}</div>
        <div class="time">${time}</div>
      `;

      chatBox.appendChild(messageDiv);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  });
</script>

</body>
</html>
