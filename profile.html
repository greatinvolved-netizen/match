<!DOCTYPE html>
<html>
<head>
  <title>Chat4Fun Profile</title>
  <style>
    body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;justify-content:center;align-items:center}
    .card{background:white;padding:30px;border-radius:20px;width:90%;max-width:450px;box-shadow:0 20px 40px rgba(0,0,0,.25);text-align:center}
    input,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;font-size:15px}
    input,textarea{border:1px solid #ccc}
    button{border:none;background:#667eea;color:white;font-weight:bold;cursor:pointer}
    img{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#ddd}
  </style>
</head>
<body>

<div class="card">
  <h1>Your Profile</h1>

  <img id="avatarPreview" src="https://via.placeholder.com/90">

  <input id="usernameInput" placeholder="Username">
  <textarea id="bioInput" placeholder="Bio"></textarea>
  <input id="avatarInput" placeholder="Avatar image URL">
  <input id="colorInput" type="color" value="#667eea">

  <button id="saveBtn">Save Profile</button>
  <button onclick="window.location.href='chat.html'">Back to Chat</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const usernameInput = document.getElementById("usernameInput");
const bioInput = document.getElementById("bioInput");
const avatarInput = document.getElementById("avatarInput");
const colorInput = document.getElementById("colorInput");
const avatarPreview = document.getElementById("avatarPreview");

let currentUser = null;

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  const snap = await getDoc(doc(db, "users", user.uid));

  if (snap.exists()) {
    const data = snap.data();
    usernameInput.value = data.username || "";
    bioInput.value = data.bio || "";
    avatarInput.value = data.avatar || "";
    colorInput.value = data.color || "#667eea";
    avatarPreview.src = data.avatar || "https://via.placeholder.com/90";
  } else {
    usernameInput.value = user.displayName || "";
  }
});

avatarInput.addEventListener("input", () => {
  avatarPreview.src = avatarInput.value || "https://via.placeholder.com/90";
});

document.getElementById("saveBtn").onclick = async () => {
  if (!currentUser) return;

  const username = usernameInput.value.trim();
  const bio = bioInput.value.trim();
  const avatar = avatarInput.value.trim();
  const color = colorInput.value;

  if (!username) {
    alert("Username required.");
    return;
  }

  await setDoc(doc(db, "users", currentUser.uid), {
    uid: currentUser.uid,
    email: currentUser.email,
    username,
    bio,
    avatar,
    color
  });

  await updateProfile(currentUser, {
    displayName: username,
    photoURL: avatar
  });

  alert("Profile saved!");
};
</script>

</body>
</html>
