<!DOCTYPE html>
<html>
<head>
  <title>View Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">Chat4Fun</div>
  <nav class="nav">
    <a href="directory.html">Browse</a>
    <a href="profile.html">My Profile</a>
    <a href="messages.html">Messages</a>
  </nav>
</header>

<main class="container">
  <section class="panel" style="max-width:720px;margin:auto;text-align:center">
    <img id="avatar" class="avatar-large" src="https://via.placeholder.com/120">
    <h1 id="username">Loading...</h1>
    <p id="status" class="muted"></p>
    <p id="bio"></p>
    <div id="tags" class="tags" style="justify-content:center"></div>
    <button id="messageBtn">Message</button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpYnAEhMuyJlzFtgQ_LOVS1d8n5YMR3Fk",
  authDomain: "chat4fun-e22c0.firebaseapp.com",
  projectId: "chat4fun-e22c0",
  storageBucket: "chat4fun-e22c0.firebasestorage.app",
  messagingSenderId: "937250432936",
  appId: "1:937250432936:web:db4d94d82171cc98519f9d",
  measurementId: "G-NJMKG24NRM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const uid = new URLSearchParams(window.location.search).get("uid");

onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }

  if (!uid) {
    alert("No profile selected.");
    window.location.href = "directory.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", uid));
  if (!snap.exists()) {
    alert("Profile not found.");
    window.location.href = "directory.html";
    return;
  }

  const data = snap.data();

  document.getElementById("avatar").src = data.avatar || "https://via.placeholder.com/120";
  document.getElementById("avatar").style.borderColor = data.color || "#667eea";
  document.getElementById("username").textContent = data.username || "User";
  document.getElementById("status").textContent = data.status || "Available";
  document.getElementById("bio").textContent = data.bio || "No bio yet.";

  const tags = (data.interests || "").split(",").map(t => t.trim()).filter(Boolean);
  document.getElementById("tags").innerHTML = tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join("");

  document.getElementById("messageBtn").onclick = () => {
    window.location.href = "messages.html?uid=" + uid;
  };
});

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[m]));
}
</script>

</body>
</html>
